[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-search-openalex"
version = "0.1.0"
description = "General-purpose OpenAlex scholarly search and citation-audit toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Naoto Tachibana"}]
dependencies = []
keywords = ["openalex", "bibliometrics", "literature-search", "citations", "scholarly-metadata"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/naototachibana/paper-search-openalex"

[project.scripts]
paper-search-openalex = "paper_search_openalex:main"

[tool.setuptools]
py-modules = ["paper_search_openalex"]
